name: labs

# Deploys every lab with containerlab on a GitHub runner and prints each
# router's protocol state, so a broken config shows up before a learner hits it.
on:
  push:
    paths: ["day*/**", "ospf-lab/**", "common/**", ".github/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lab: [day1, day1-bgp, day1b, day2, day2-te, day3, day4, day5, day6, day7, ospf-lab]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)" -- -v 0.79.0
      - name: Load MPLS kernel modules
        run: sudo modprobe mpls_router mpls_iptunnel || true
      - name: Pull FRR
        run: sudo docker pull quay.io/frrouting/frr:10.7.1
      - name: Deploy and check ${{ matrix.lab }}
        run: bash .github/scripts/check-lab.sh "${{ matrix.lab }}"
