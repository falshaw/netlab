# day1 - BGP (eBGP fundamentals) - EMPTY CANVAS (wiring + IPs done, NO routing protocol yet)
# Deploy:  cd day1 && sudo containerlab deploy
# Enter:   sudo docker exec -it clab-day1-r1 vtysh
# Destroy: sudo containerlab destroy
name: day1

topology:
  kinds:
    linux:
      image: frrouting/frr:latest
  nodes:
    r1:
      kind: linux
      binds:
        - ../common/daemons:/etc/frr/daemons
        - r1.conf:/etc/frr/frr.conf
    r2:
      kind: linux
      binds:
        - ../common/daemons:/etc/frr/daemons
        - r2.conf:/etc/frr/frr.conf
    r3:
      kind: linux
      binds:
        - ../common/daemons:/etc/frr/daemons
        - r3.conf:/etc/frr/frr.conf
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.0.12.0/30
    - endpoints: ["r1:eth2", "r3:eth1"]   # 10.0.13.0/30
    - endpoints: ["r2:eth2", "r3:eth2"]   # 10.0.23.0/30
