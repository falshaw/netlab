frr version 8.5
frr defaults traditional
hostname r3
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 3.3.3.3/32
!
interface eth1
 ip address 10.0.13.2/30
!
interface eth2
 ip address 10.0.23.2/30
!
! ===== EMPTY CANVAS: BGP (eBGP fundamentals) =====
! Build from scratch: router bgp on each (r1=AS65001, r2=AS65002, r3=AS65003), a neighbor statement to each link peer, and network <loopback>/32 to advertise yourself. Then steer: local-preference OUTBOUND, as-path prepend INBOUND.
