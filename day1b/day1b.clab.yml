# day1b - BGP DEEP DIVE (iBGP + next-hop-self + Route Reflectors + communities)
# The architect-level BGP that is the core of service-provider routing.
#
# Deploy:  cd day1b && sudo containerlab deploy
# Enter:   sudo docker exec -it clab-day1b-r1 vtysh
# Destroy: sudo containerlab destroy
#
# THE STORY (one AS peering with the internet):
#   AS 65000 = "our network" = r1 (border + route reflector) + r2 + r3 (internal).
#   AS 65100 = "the internet" = r4, which advertises a public prefix 203.0.113.0/24.
#   r2 and r3 are NOT wired to each other on purpose — that gap is the whole point of
#   the Route Reflector lesson in Stage C.
#
# Deploys with interfaces + IPs only (from rN.conf). NO BGP: you build it from NOTES.md.
#
#            AS65100                    AS 65000 ("our network")
#         r4 (lo 4.4.4.4)
#              | 10.0.14.0/30
#         r1 (lo 1.1.1.1)  <-- border router + Route Reflector
#         /                \
#   10.0.12.0/30        10.0.13.0/30
#       /                    \
#  r2 (lo 2.2.2.2)      r3 (lo 3.3.3.3)   <-- internal, NOT peered to each other
name: day1b

topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.7.1
  nodes:
    r1:
      kind: linux
      binds:
        - ../common/daemons:/etc/frr/daemons
        - r1.conf:/etc/frr/frr.conf
    r2:
      kind: linux
      binds:
        - ../common/daemons:/etc/frr/daemons
        - r2.conf:/etc/frr/frr.conf
    r3:
      kind: linux
      binds:
        - ../common/daemons:/etc/frr/daemons
        - r3.conf:/etc/frr/frr.conf
    r4:
      kind: linux
      binds:
        - ../common/daemons:/etc/frr/daemons
        - r4.conf:/etc/frr/frr.conf
  links:
    - endpoints: ["r1:eth1", "r4:eth1"]   # 10.0.14.0/30  (eBGP: our border <-> internet)
    - endpoints: ["r1:eth2", "r2:eth1"]   # 10.0.12.0/30  (iBGP: r1 <-> r2)
    - endpoints: ["r1:eth3", "r3:eth1"]   # 10.0.13.0/30  (iBGP: r1 <-> r3)
