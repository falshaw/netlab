frr version 10.7.1
frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 1.1.1.1/32
!
interface eth1
 ip address 10.0.14.1/30
!
interface eth2
 ip address 10.0.12.1/30
!
interface eth3
 ip address 10.0.13.1/30
!
! ===== EMPTY CANVAS: r1 = AS 65000 border router + Route Reflector =====
! eth1 -> r4 (the internet, AS65100) = eBGP.  eth2 -> r2, eth3 -> r3 = iBGP (same AS).
! You build it by pasting from day1b/NOTES.md, stage by stage:
!   A) eBGP to r4         B) iBGP to r2/r3 + next-hop-self
!   C) make r1 a route-reflector   D) (stretch) communities
