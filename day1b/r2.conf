frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 2.2.2.2/32
!
interface eth1
 ip address 10.0.12.2/30
!
! ===== EMPTY CANVAS: r2 = AS 65000 internal router (Route Reflector CLIENT) =====
! Only one neighbour: r1 at 10.0.12.1 (iBGP, same AS 65000). You are NOT wired to r3.
