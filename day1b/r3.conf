frr version 8.5
frr defaults traditional
hostname r3
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 3.3.3.3/32
!
interface eth1
 ip address 10.0.13.2/30
!
! ===== EMPTY CANVAS: r3 = AS 65000 internal router (Route Reflector CLIENT) =====
! Only one neighbour: r1 at 10.0.13.1 (iBGP, same AS 65000). You are NOT wired to r2.
