frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 1.1.1.1/32
!
! ===== EMPTY CANVAS: r1 = AS 65000 border to ISP-A (r3) =====
! eth1 -> r3 (ISP-A, AS65100) = eBGP.  eth2 -> r2 = iBGP.
! Interface IPs + the 192.0.2.0/24 Null0 route are set for you at deploy.
! YOU build "router bgp 65000". Work through day2-te/NOTES.md.
