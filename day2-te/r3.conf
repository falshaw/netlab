frr version 10.7.1
frr defaults traditional
hostname r3
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 3.3.3.3/32
!
interface eth1
 ip address 10.0.13.2/30
!
ip route 8.8.8.0/24 Null0
ip route 100.64.0.0/24 Null0
!
! r3 = ISP-A (AS 65100). Comes up working. Do not configure - it is "the internet".
! Advertises 8.8.8.0/24 and 100.64.0.0/24. 8.8.8.0/24 is tagged with community
! 65100:120 ("customer: lower my local-pref") for Task 4 in NOTES.md.
route-map ISPA-TAG-120 permit 10
 set community 65100:120
!
router bgp 65100
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 neighbor 10.0.13.1 remote-as 65000
 !
 address-family ipv4 unicast
  network 8.8.8.0/24 route-map ISPA-TAG-120
  network 100.64.0.0/24
 exit-address-family
!
