frr version 10.7.1
frr defaults traditional
hostname r4
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 4.4.4.4/32
!
interface eth1
 ip address 10.0.24.2/30
!
ip route 8.8.8.0/24 Null0
ip route 203.0.113.0/24 Null0
!
! r4 = ISP-B (AS 65200). Comes up working. Do not configure - it is "the internet".
! Advertises 8.8.8.0/24 and 203.0.113.0/24.
router bgp 65200
 bgp router-id 4.4.4.4
 no bgp ebgp-requires-policy
 neighbor 10.0.24.1 remote-as 65000
 !
 address-family ipv4 unicast
  network 8.8.8.0/24
  network 203.0.113.0/24
 exit-address-family
!
