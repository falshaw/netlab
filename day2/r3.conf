frr version 10.7.1
frr defaults traditional
hostname r3
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 3.3.3.3/32
!
interface eth1
 ip address 10.0.13.2/30
!
interface eth2
 ip address 10.0.23.2/30
!
! ===== EMPTY CANVAS: Anycast + multihoming =====
! Build: r2 AND r3 both advertise the SAME anycast prefix 100.64.0.1/32 into BGP. Watch r1 see two paths to one prefix and choose the nearest. Shut one PoP, traffic shifts, no address change.
