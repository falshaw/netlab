frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 1.1.1.1/32
!
interface eth1
 ip address 10.0.12.1/30
!
interface eth2
 ip address 10.0.13.1/30
!
! ===== EMPTY CANVAS: DDoS defence: RTBH + FlowSpec =====
! Build: RTBH (route-map sets a blackhole community on a /32 so the upstream drops it) and a FlowSpec rule (drop one specific 5-tuple). Surgical vs blunt DDoS tools.
