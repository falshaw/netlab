# day4 - OSPF (then IS-IS on the same triangle) - EMPTY CANVAS (wiring + IPs done, NO routing protocol yet)
# Deploy:  cd day4 && sudo containerlab deploy
# Enter:   sudo docker exec -it clab-day4-r1 vtysh
# Destroy: sudo containerlab destroy
name: day4

topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.7.1
  nodes:
    r1:
      kind: linux
      binds:
        - ../common/daemons:/etc/frr/daemons
        - r1.conf:/etc/frr/frr.conf
    r2:
      kind: linux
      binds:
        - ../common/daemons:/etc/frr/daemons
        - r2.conf:/etc/frr/frr.conf
    r3:
      kind: linux
      binds:
        - ../common/daemons:/etc/frr/daemons
        - r3.conf:/etc/frr/frr.conf
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.0.12.0/30
    - endpoints: ["r1:eth2", "r3:eth1"]   # 10.0.13.0/30
    - endpoints: ["r2:eth2", "r3:eth2"]   # 10.0.23.0/30
