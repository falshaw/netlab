frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 2.2.2.2/32
!
interface eth1
 ip address 10.0.12.2/30
!
interface eth2
 ip address 10.0.23.1/30
!
! ===== EMPTY CANVAS: OSPF (then IS-IS on the same triangle) =====
! Build: router ospf on each, network <links>/30 area 0 + loopback area 0, set router-id. Watch neighbors reach FULL and O routes appear. Then redo with IS-IS to speak to the difference.
