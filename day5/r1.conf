frr version 10.7.1
frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 1.1.1.1/32
!
interface eth1
 ip address 10.0.12.1/30
!
interface eth2
 ip address 10.0.13.1/30
!
! ===== EMPTY CANVAS: MPLS L3VPN + Segment Routing (control-plane) =====
! Build (control-plane only): MPLS core via LDP, a VRF on the edge, MP-BGP VPNv4 (RD/RT). Read the label + VRF tables. Cloud cannot forward labels - control-plane is the point.
