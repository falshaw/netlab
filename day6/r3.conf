frr version 10.7.1
frr defaults traditional
hostname r3
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 3.3.3.3/32
!
interface eth1
 ip address 10.0.13.2/30
!
interface eth2
 ip address 10.0.23.2/30
!
! ===== EMPTY CANVAS: Resilience: BFD + ECMP =====
! Build: BFD on the r1-r2 and r1-r3 links for sub-second failure detection; ECMP active/active across the two equal-cost paths. Break a link, time the failover with vs without BFD.
